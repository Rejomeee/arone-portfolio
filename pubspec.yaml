name: flutter_my_portfolio
description: Portfolio of Arone Jerome Malicse, a Flutter developer.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  google_fonts: ^8.2.1
  http: ^1.6.0
  reactive_forms: ^18.2.2
  # 0.13 keeps the existing .riv files working. Rive 0.14+ needs a re-export.
  rive: 0.13.20
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
